name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install asm6
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make git
          git clone https://github.com/freewing-gh/asm6.git
          cd asm6
          gcc -o asm6 asm6.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code
        run: |
          echo "${{ github.event.client_payload.asm_code }}" > game.asm

      - name: Compile with asm6
        run: |
          asm6 game.asm output.nes

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes
