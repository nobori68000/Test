name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install asm6
        run: |
          mkdir -p asm6_src
          
          # -f オプション付きで404時は即座に次の候補URLへ自動切り替え
          if curl -f -sSL https://raw.githubusercontent.com/freewing-gh/asm6/main/asm6.c -o asm6_src/asm6.c; then
            echo "Fetched from freewing-gh (main)"
          elif curl -f -sSL https://raw.githubusercontent.com/freewing-gh/asm6/master/asm6.c -o asm6_src/asm6.c; then
            echo "Fetched from freewing-gh (master)"
          elif curl -f -sSL https://raw.githubusercontent.com/tokumaru/asm6f/master/asm6f.c -o asm6_src/asm6.c; then
            echo "Fetched from tokumaru (asm6f)"
          elif curl -f -sSL https://raw.githubusercontent.com/mkwong98/asm6f/master/asm6f.c -o asm6_src/asm6.c; then
            echo "Fetched from mkwong98 (asm6f)"
          else
            echo "Error: Could not download asm6 source."
            exit 1
          fi

          gcc -O2 -o asm6 asm6_src/asm6.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code safely
        run: |
          # jqでJSONからアセンブリコードを抽出（特殊文字によるフリーズを全自動回避）
          jq -r '.client_payload.asm_code' "$GITHUB_EVENT_PATH" > game.asm

      - name: Compile NES ROM with asm6
        run: |
          asm6 game.asm output.nes

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes