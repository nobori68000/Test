name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Compile Real asm6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import urllib.request, json, os, sys

          token = os.environ.get('GITHUB_TOKEN', '')
          headers = {'User-Agent': 'GitHub-Actions-Workflow'}
          if token:
              headers['Authorization'] = f'Bearer {token}'

          search_url = 'https://api.github.com/search/repositories?q=asm6+in:name'
          req = urllib.request.Request(search_url, headers=headers)

          found = False
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
              
              for item in data.get('items', []):
                  repo = item['full_name']
                  contents_url = f'https://api.github.com/repos/{repo}/contents'
                  try:
                      c_req = urllib.request.Request(contents_url, headers=headers)
                      with urllib.request.urlopen(c_req) as c_resp:
                          files = json.loads(c_resp.read().decode())
                      for f in files:
                          if isinstance(f, dict) and f.get('name', '').endswith('.c'):
                              dl_url = f.get('download_url')
                              if dl_url:
                                  dl_req = urllib.request.Request(dl_url, headers=headers)
                                  with urllib.request.urlopen(dl_req) as dl_resp:
                                      code = dl_resp.read().decode('utf-8', errors='ignore')
                                  if 'main' in code and ('6502' in code or 'opcode' in code or 'asm6' in code):
                                      with open('asm6.c', 'w', encoding='utf-8') as out_f:
                                          out_f.write(code)
                                      found = True
                                      break
                      if found:
                          break
                  except Exception:
                      continue
          except Exception as e:
              print(f'API Search Error: {e}')

          if not found:
              sys.exit(1)
          "
          gcc -O2 -o asm6 asm6.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code
        run: |
          jq -r '.client_payload.asm_code' "$GITHUB_EVENT_PATH" > game.asm

      - name: Auto-Fix Long Branches (Prevent Value out of range)
        run: |
          python3 -c "
          import re

          branch_map = {
              'BEQ': 'BNE', 'BNE': 'BEQ',
              'BCS': 'BCC', 'BCC': 'BCS',
              'BMI': 'BPL', 'BPL': 'BMI',
              'BVS': 'BVC', 'BVC': 'BVS'
          }

          with open('game.asm', 'r', encoding='utf-8', errors='ignore') as f:
              lines = f.readlines()

          new_lines = []
          count = 0

          for line in lines:
              m = re.search(r'^(\s*)(BEQ|BNE|BCS|BCC|BMI|BPL|BVS|BVC)\b\s*([a-zA-Z0-9_@+\-]+)(.*)$', line, re.IGNORECASE)
              if m:
                  indent, op, target, rest = m.groups()
                  opp = branch_map[op.upper()]
                  label = f'_auto_skip_{count}'
                  count += 1
                  new_lines.append(f'{indent}{opp} {label}\n')
                  new_lines.append(f'{indent}JMP {target}\n')
                  new_lines.append(f'{label}:{rest}\n')
              else:
                  new_lines.append(line)

          with open('game.asm', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)

          print(f'Successfully auto-fixed {count} branch instructions!')
          "

      - name: Compile NES ROM with asm6
        run: |
          asm6 game.asm output.nes

      - name: Verify iNES Header
        run: |
          python3 -c "
          with open('output.nes', 'rb') as f:
              header = f.read(4)
          assert header == b'NES\x1a', f'Invalid NES Header! Got {header}'
          print('iNES Header valid! ROM build successful.')
          "

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes