name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install asm6
        run: |
          git clone https://github.com/mkwong98/asm6f.git asm6_src
          cd asm6_src
          gcc -O2 -o asm6 asm6f.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code
        run: |
          cat << 'EOF' > game.asm
          ${{ github.event.client_payload.asm_code }}
          EOF

      - name: Compile with asm6
        run: |
          asm6 game.asm output.nes

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes