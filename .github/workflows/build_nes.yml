name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install asm6
        run: |
          # asm6開発者（loopy氏）の公式サイトから直接取得
          curl -sSL http://loopy.ines.us/asm6.zip -o asm6.zip
          unzip asm6.zip
          gcc -O2 -o asm6 asm6.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code
        run: |
          cat << 'EOF' > game.asm
          ${{ github.event.client_payload.asm_code }}
          EOF

      - name: Compile with asm6
        run: |
          asm6 game.asm output.nes

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes