name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Official asm6 Compiler
        run: |
          # Pythonを使って公式のasm6.zipを確実に取得・解凍
          python3 -c "
          import urllib.request, zipfile, io
          url = 'http://loopy.ines.us/asm6.zip'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response:
              z = zipfile.ZipFile(io.BytesIO(response.read()))
              z.extractall('.')
          print('asm6.c successfully extracted!')
          "
          gcc -O2 -o asm6 asm6.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code safely
        run: |
          # jqでJSONからアセンブリコードを安全抽出
          jq -r '.client_payload.asm_code' "$GITHUB_EVENT_PATH" > game.asm

      - name: Compile NES ROM with asm6
        run: |
          asm6 game.asm output.nes

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes