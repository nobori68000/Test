name: Build NES ROM with asm6

on:
  repository_dispatch:
    types: [build-nes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Official asm6
        run: |
          # GitHub公式アーカイブから直接取得してコンパイル（Git認証不要・404なし）
          curl -sSL https://codeload.github.com/freewing-gh/asm6/tar.gz/refs/heads/master | tar -xz
          gcc -O2 -o asm6 asm6-master/asm6.c
          sudo mv asm6 /usr/local/bin/

      - name: Save Generated Assembly Code safely
        run: |
          # jqを使用してJSONからアセンブリコードを安全抽出（フリーズ完全防止）
          jq -r '.client_payload.asm_code' "$GITHUB_EVENT_PATH" > game.asm

      - name: Compile NES ROM with asm6
        run: |
          asm6 game.asm output.nes

      - name: Upload NES ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-nes-rom
          path: output.nes